<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#b94a2f" />
    <meta
      name="description"
      content="Your personal air-fryer kitchen: recipes, meal planning and cooking memories, available offline."
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>AirFuel Kitchen · Good food, less fuss</title>
    <script>
      // Set the theme before first paint so dark-mode visitors never see a light flash.
      // App mirrors the saved choice to this key because its data loads asynchronously.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("airfuel-theme");
        } catch (error) {}
        var dark =
          stored === "dark" ||
          ((stored === null || stored === "system") &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
